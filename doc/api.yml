openapi: 3.0.3
info:
  title: SchoolM API
  description: School management API (HEI)
  version: v1
paths:
  /courses/{courseId}/teacher:
    put:
      tags:
        - Course
      summary: Assign teachers to a course
      description: Replaces the full set of teachers assigned to the course.
      operationId: assignTeachers
      parameters:
        - name: courseId
          in: path
          required: true
          description: Course identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherIdsRequest'
      responses:
        '200':
          description: Teachers assigned to the course successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    TeacherIdsRequest:
      type: object
      required:
        - teacherIds
      properties:
        teacherIds:
          type: array
          minItems: 1
          items:
            type: string
          description: List of teacher identifiers to assign to the course
    Course:
      type: object
      properties:
        id:
          type: string
        ref:
          type: string
        title:
          type: string
        credit:
          type: integer
        track:
          type: string
        semester:
          type: string
        teacherIds:
          type: array
          items:
            type: string
          description: Teachers assigned to the course
    ErrorBody:
      type: object
      properties:
        status:
          type: integer
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'