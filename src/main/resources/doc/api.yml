openapi: 3.0.3
info:
  title: SchoolM API
  description: School management API (HEI)
  version: v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in and get a bearer token
      description: Authenticates by email/password and returns a JWT along with the user profile.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /courses:
    get:
      tags:
        - Course
      summary: List all courses
      description: Returns the full list of courses.
      operationId: getAllCourses
      responses:
        '200':
          description: Courses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
  /courses/{courseId}:
    get:
      tags:
        - Course
      summary: Get a course by id
      description: Returns a single course by its identifier.
      operationId: getCourseById
      parameters:
        - name: courseId
          in: path
          required: true
          description: Course identifier
          schema:
            type: string
      responses:
        '200':
          description: Course retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/teacher:
    put:
      tags:
        - Course
      summary: Assign teachers to a course
      description: Replaces the full set of teachers assigned to the course.
      operationId: assignTeachers
      parameters:
        - name: courseId
          in: path
          required: true
          description: Course identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherIdsRequest'
      responses:
        '200':
          description: Teachers assigned to the course successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/group:
    put:
      tags:
        - Course
      summary: Assign groups to a course
      description: Replaces the full set of groups that take the course.
      operationId: assignGroups
      parameters:
        - name: courseId
          in: path
          required: true
          description: Course identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupIdsRequest'
      responses:
        '200':
          description: Groups assigned to the course successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{id}/semester-validation:
    get:
      tags:
        - Student
      summary: Validate a semester for a student
      description: >-
        Returns whether a semester is validated for a student. A course is
        acquired when its final grade is greater than or equal to 10, and the
        semester is validated when every course of the semester is acquired.
      operationId: getSemesterValidation
      parameters:
        - name: id
          in: path
          required: true
          description: Student identifier
          schema:
            type: string
        - name: semester
          in: query
          required: true
          description: Semester to validate
          schema:
            type: string
            enum:
              - S1
              - S2
              - S3
              - S4
              - S5
              - S6
      responses:
        '200':
          description: Semester validation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterValidation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{id}/graduate-transcript:
    get:
      tags:
        - Student
      summary: Get the graduate transcript of a student
      description: >-
        Returns the graduate transcript of a student. The transcript covers the
        academic year of the current semester (or the one matching the given
        month and year). A course is marked COMPLET when all its exams have been
        taken (sum of coefficients equals one) and its semester has been reached;
        otherwise it is INCOMPLET. The global status is COMPLET when every course
        of the transcript is COMPLET.
      operationId: getGraduateTranscript
      parameters:
        - name: id
          in: path
          required: true
          description: Student identifier
          schema:
            type: string
        - name: month
          in: query
          required: false
          description: >-
            Month of the reference date. Defaults to the current month. Must be
            between 1 and 12.
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: year
          in: query
          required: false
          description: >-
            Year of the reference date. Defaults to the current year.
          schema:
            type: integer
      responses:
        '200':
          description: Graduate transcript retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{id}/group-flows:
    get:
      tags:
        - Student
      summary: Get the group history of a student
      description: >-
        Returns the history of group changes of a student (JOIN events), ordered
        by creation date descending. Grades are kept when a student changes
        group, since they are attached to the student, not the group.
      operationId: getGroupFlows
      parameters:
        - name: id
          in: path
          required: true
          description: Student identifier
          schema:
            type: string
      responses:
        '200':
          description: Group flow history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupFlow'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Student
      summary: Move a student to another group
      description: >-
        Moves a student to the given group. Records a JOIN group flow and
        updates the student's current group. The student's grades are kept.
      operationId: moveStudentToGroup
      parameters:
        - name: id
          in: path
          required: true
          description: Student identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveStudentGroupRequest'
      responses:
        '200':
          description: Student moved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFlow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{id}/transcript/email:
    post:
      tags:
        - Student
      summary: Email a student's transcript for a specific academic year
      description: >-
        Generates the transcript for the pair of semesters containing the
        given semester (S1/S2 = L1, S3/S4 = L2, S5/S6 = L3), uploads it as a
        PDF file on S3, and emails it to the student.
      operationId: emailTranscript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: semester
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Semester'
      responses:
        '202':
          description: Transcript email requested successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /grades/{gradeId}:
    put:
      tags:
        - Grade
      summary: Update a grade with change reason
      description: Updates a grade value and records the reason for the change. Keeps history of all changes.
      operationId: updateGrade
      parameters:
        - name: gradeId
          in: path
          required: true
          description: Grade identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGradeRequest'
      responses:
        '200':
          description: Grade updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /grades/{gradeId}/history:
    get:
      tags:
        - Grade
      summary: Get grade change history
      description: Returns all historical versions of a grade with timestamps and change reasons
      operationId: getGradeHistory
      parameters:
        - name: gradeId
          in: path
          required: true
          description: Grade identifier
          schema:
            type: string
      responses:
        '200':
          description: Grade history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeHistory'
        '404':
          $ref: '#/components/responses/NotFound'
  /cohorts:
    get:
      tags:
        - Cohort
      summary: List all cohorts
      description: Returns the list of cohorts (promotions), newest first.
      operationId: getCohorts
      responses:
        '200':
          description: Cohorts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cohort'
  /cohorts/{ref}/graduates:
    get:
      tags:
        - Cohort
      summary: Generate the graduate list of a cohort as an XLSX file on S3
      description: >-
        Computes the graduates of the cohort for the given track (EL or TN) and
        uploads the result as an XLSX file on S3. A student graduates when every
        course of its group with exams (up to the current semester, or the one
        matching the given month and year) has a final grade greater than or
        equal to 10. Students are ranked by their credit-weighted average grade.
        The response contains a presigned URL to download the file.
      operationId: getGraduates
      parameters:
        - name: ref
          in: path
          required: true
          description: Cohort reference (promotion)
          schema:
            type: string
        - name: track
          in: query
          required: true
          description: Track to generate the graduate list for
          schema:
            type: string
            enum:
              - EL
              - TN
        - name: month
          in: query
          required: false
          description: >-
            Month of the reference date. Defaults to the current month. Must be
            between 1 and 12.
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: year
          in: query
          required: false
          description: >-
            Year of the reference date. Defaults to the current year.
          schema:
            type: integer
      responses:
        '200':
          description: Graduate list generated and uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraduateFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /course-assignments:
    get:
      tags:
        - CourseAssignment
      summary: List course assignments by filter
      description: >-
        Returns a paged list of course assignments (course + group + teachers for
        a given academic year and semester). Each filter is optional.
      operationId: getCourseAssignments
      parameters:
        - name: groupId
          in: query
          required: false
          description: Filter by group identifier
          schema:
            type: string
        - name: teacherId
          in: query
          required: false
          description: Filter by teacher identifier
          schema:
            type: string
        - name: courseId
          in: query
          required: false
          description: Filter by course identifier
          schema:
            type: string
        - name: academicYear
          in: query
          required: false
          description: Filter by academic year
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: size
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Course assignments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseAssignment'
                  totalElements:
                    type: integer
    put:
      tags:
        - CourseAssignment
      summary: Create or update course assignments
      description: >-
        Creates new course assignments or updates existing ones in batch. An
        assignment is identified by the unique combination of course, group,
        academic year and semester.
      operationId: upsertCourseAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CourseAssignmentRequest'
      responses:
        '200':
          description: Course assignments saved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
  /course-assignments/{id}:
    get:
      tags:
        - CourseAssignment
      summary: Get a course assignment by id
      operationId: getCourseAssignmentById
      parameters:
        - name: id
          in: path
          required: true
          description: Course assignment identifier
          schema:
            type: string
      responses:
        '200':
          description: Course assignment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAssignment'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - CourseAssignment
      summary: Delete a course assignment
      operationId: deleteCourseAssignment
      parameters:
        - name: id
          in: path
          required: true
          description: Course assignment identifier
          schema:
            type: string
      responses:
        '204':
          description: Course assignment deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
  /course-assignments/curriculum-status:
    get:
      tags:
        - CourseAssignment
      summary: Get the curriculum status of a group for a semester
      description: >-
        Compares the credits assigned to a group for a given academic year and
        semester against the target (30 credits) and lists the courses of the
        curriculum that are not yet assigned.
      operationId: getCurriculumStatus
      parameters:
        - name: groupId
          in: query
          required: true
          description: Group identifier
          schema:
            type: string
        - name: academicYear
          in: query
          required: true
          description: Academic year
          schema:
            type: integer
        - name: semester
          in: query
          required: true
          description: Semester to check
          schema:
            $ref: '#/components/schemas/Semester'
      responses:
        '200':
          description: Curriculum status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumStatus'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - ADMIN
            - TEACHER
            - STUDENT
    CourseAssignmentRequest:
      type: object
      required:
        - courseId
        - groupId
        - teacherIds
        - academicYear
        - semester
        - credits
      properties:
        id:
          type: string
          description: Identifier, present when updating an existing assignment
        courseId:
          type: string
        groupId:
          type: string
        teacherIds:
          type: array
          minItems: 1
          items:
            type: string
        academicYear:
          type: integer
          minimum: 2000
          maximum: 2100
        semester:
          $ref: '#/components/schemas/Semester'
        credits:
          type: integer
          minimum: 1
    CourseAssignment:
      type: object
      properties:
        id:
          type: string
        courseId:
          type: string
        courseRef:
          type: string
        courseTitle:
          type: string
        groupId:
          type: string
        groupRef:
          type: string
        teacherIds:
          type: array
          items:
            type: string
        academicYear:
          type: integer
        semester:
          $ref: '#/components/schemas/Semester'
        credits:
          type: integer
    CurriculumStatus:
      type: object
      properties:
        semester:
          $ref: '#/components/schemas/Semester'
        assignedCredits:
          type: integer
        targetCredits:
          type: integer
        complete:
          type: boolean
        missingCourses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/CourseAssignment'
    TeacherIdsRequest:
      type: object
      required:
        - teacherIds
      properties:
        teacherIds:
          type: array
          minItems: 1
          items:
            type: string
          description: List of teacher identifiers to assign to the course
    GroupIdsRequest:
      type: object
      required:
        - groupIds
      properties:
        groupIds:
          type: array
          minItems: 1
          items:
            type: string
          description: List of group identifiers that take the course
    MoveStudentGroupRequest:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: string
          description: Identifier of the group the student moves to
    GroupFlow:
      type: object
      properties:
        id:
          type: string
        studentId:
          type: string
        groupId:
          type: string
        groupFlowType:
          type: string
          enum:
            - JOIN
            - LEAVE
        createdAt:
          type: string
          format: date-time
    UpdateGradeRequest:
      type: object
      required:
        - value
        - changeReason
      properties:
        value:
          type: number
          format: double
          minimum: 0
          maximum: 20
          description: New grade value (0-20)
        changeReason:
          type: string
          minLength: 1
          description: Reason for the grade change
    Course:
      type: object
      properties:
        id:
          type: string
        ref:
          type: string
        title:
          type: string
        credit:
          type: integer
        track:
          type: string
        semester:
          type: string
        teacherIds:
          type: array
          items:
            type: string
          description: Teachers assigned to the course
        groupIds:
          type: array
          items:
            type: string
          description: Groups that take the course
    SemesterValidation:
      type: object
      properties:
        studentId:
          type: string
        studentRef:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        groupRef:
          type: string
        semester:
          type: string
        totalCredits:
          type: integer
        acquiredCredits:
          type: integer
        validated:
          type: boolean
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CourseValidation'
    CourseValidation:
      type: object
      properties:
        courseId:
          type: string
        ref:
          type: string
        title:
          type: string
        credit:
          type: integer
        finalGrade:
          type: number
          format: double
        acquired:
          type: boolean
    Transcript:
      type: object
      properties:
        studentId:
          type: string
        studentRef:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        groupRef:
          type: string
        cohortRef:
          type: string
        academicYear:
          type: string
          description: Academic year of the transcript, e.g. 2024-2025
        semesters:
          type: array
          items:
            $ref: '#/components/schemas/Semester'
          description: The pair of semesters covered by the transcript
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CourseGrade'
        status:
          $ref: '#/components/schemas/TranscriptStatus'
    CourseGrade:
      type: object
      properties:
        courseId:
          type: string
        ref:
          type: string
        title:
          type: string
        semester:
          $ref: '#/components/schemas/Semester'
        credit:
          type: integer
        coefficientSum:
          type: number
          format: double
          description: Sum of the coefficients of the exams of the course
        exams:
          type: array
          items:
            $ref: '#/components/schemas/ExamGrade'
        finalGrade:
          type: number
          format: double
          description: Weighted sum of the exam grades
        status:
          $ref: '#/components/schemas/TranscriptStatus'
    ExamGrade:
      type: object
      properties:
        examId:
          type: string
        date:
          type: string
          description: Date of the exam
        coefficient:
          type: number
          format: double
        value:
          type: number
          format: double
          nullable: true
          description: Grade of the student, null when the exam has not been taken
    Grade:
      type: object
      properties:
        id:
          type: string
        studentId:
          type: string
        examId:
          type: string
        value:
          type: number
          format: double
        changeReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GradeHistory:
      type: object
      properties:
        id:
          type: string
        value:
          type: number
          format: double
        changeReason:
          type: string
        createdAt:
          type: string
          format: date-time
    Semester:
      type: string
      enum:
        - S1
        - S2
        - S3
        - S4
        - S5
        - S6
    Cohort:
      type: object
      properties:
        ref:
          type: string
          description: Cohort reference (promotion)
        entryYear:
          type: integer
          description: Entry year of the cohort
    GraduateFile:
      type: object
      properties:
        fileName:
          type: string
          description: Name of the generated XLSX file
        url:
          type: string
          description: Presigned URL to download the file from S3
        expiresAt:
          type: string
          format: date-time
          description: Expiration date of the presigned URL
    TranscriptStatus:
      type: string
      enum:
        - COMPLET
        - INCOMPLET
    ErrorBody:
      type: object
      properties:
        status:
          type: integer
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
